<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- セキュリティ多層防御：外部通信/外部スクリプトを禁止し、影響範囲を最小化 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none';">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>株損益メモ</title>
<!-- ホーム画面アイコン（iPhone） -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<!-- ホーム画面から全画面アプリとして起動 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="株損益メモ">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f2f4f8;
    --card: #ffffff;
    --line: #e2e6ee;
    --text: #1c2333;
    --sub: #7a8296;
    --accent: #2f6df6;
    --plus: #1668e3;    /* 利益：青 */
    --minus: #d13a3a;   /* 損失：赤 */
    --danger: #e5484d;
    --header-h: 210px;
    --footer-h: 88px;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; height: 100dvh; }

  /* ===== 入力エリア（上部固定） ===== */
  header {
    flex: 0 0 auto;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 12px;
  }
  header h1 {
    margin: 0 0 12px;
    font-size: 17px; font-weight: 700; letter-spacing: .02em;
    display: flex; align-items: center; gap: 8px;
  }
  header h1 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .field { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label { font-size: 11px; color: var(--sub); padding-left: 2px; }
  input {
    width: 100%; min-width: 0; max-width: 100%; height: 46px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 12px;
    background: #fbfcfe; color: var(--text);
    font-size: 16px; /* 16px以上でiOSの自動ズームを防ぐ */
    outline: none; transition: border-color .15s, background .15s;
    -webkit-appearance: none; appearance: none; /* iOSで日付欄が横にはみ出すのを防ぐ */
  }
  /* 日付欄：iOSで幅100%を効かせ、中身を上下中央・左寄せで表示 */
  input[type="date"] { display: flex; align-items: center; text-align: left; }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
  input:focus { border-color: var(--accent); background: #fff; }
  input::placeholder { color: #b3bac8; }
  input[type="number"] { text-align: right; font-variant-numeric: tabular-nums; }

  .add-btn {
    width: 100%; height: 48px; margin-top: 2px;
    border: none; border-radius: 12px;
    background: var(--accent); color: #fff;
    font-size: 16px; font-weight: 700; letter-spacing: .04em;
    cursor: pointer; transition: opacity .15s, transform .05s;
  }
  .add-btn:active { transform: scale(.99); opacity: .9; }

  /* ===== 一覧エリア（中央スクロール） ===== */
  main {
    flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 10px 12px 14px;
  }
  .list-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 6px 8px; color: var(--sub); font-size: 12px;
  }
  .list-head .right { display: flex; align-items: center; gap: 12px; }
  .list-head .count { font-weight: 600; }
  .edit-btn {
    border: none; background: transparent; color: var(--accent);
    font-size: 14px; font-weight: 700; padding: 4px 2px; cursor: pointer;
  }
  .edit-btn:active { opacity: .6; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
  }
  .li-main { flex: 1; min-width: 0; }
  .li-name { font-size: 15px; font-weight: 600; word-break: break-word; line-height: 1.3; }
  .li-date { font-size: 12px; color: var(--sub); margin-top: 3px; }
  .li-pl {
    flex: 0 0 auto; font-size: 16px; font-weight: 700;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .li-pl.plus { color: var(--plus); }
  .li-pl.minus { color: var(--minus); }

  /* ===== 編集モード ===== */
  li.editing { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px; }
  .edit-grid { display: flex; gap: 8px; }
  .edit-grid input {
    height: 42px; padding: 0 10px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; background: #fbfcfe;
  }
  .edit-grid .e-date { flex: 1.05; }
  .edit-grid .e-name { flex: 1.25; }
  .edit-grid .e-pl { flex: 1; text-align: right; font-variant-numeric: tabular-nums; }
  .row-del {
    align-self: flex-end; border: none; border-radius: 10px;
    background: #fdecec; color: var(--danger);
    font-size: 14px; font-weight: 700; padding: 8px 16px; cursor: pointer;
  }
  .row-del:active { background: #f8d4d4; }

  .empty {
    text-align: center; color: var(--sub); font-size: 14px;
    padding: 48px 20px; line-height: 1.7;
  }
  .empty .big { font-size: 34px; margin-bottom: 8px; }

  /* ===== 合計損益エリア（下部固定） ===== */
  footer {
    flex: 0 0 auto;
    background: var(--card);
    border-top: 1px solid var(--line);
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 -4px 16px rgba(20,30,60,.06);
  }
  footer .label { font-size: 14px; color: var(--sub); font-weight: 600; }
  footer .total {
    font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums;
    letter-spacing: .01em;
  }
  footer .total.plus { color: var(--plus); }
  footer .total.minus { color: var(--minus); }
  footer .total.zero { color: var(--text); }
</style>
</head>
<body>
  <header>
    <h1><span class="dot"></span>株損益メモ</h1>
    <div class="form-row">
      <div class="field">
        <label for="date">売却日</label>
        <input type="date" id="date">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="name">銘柄</label>
        <input type="text" id="name" autocomplete="off" enterkeyhint="next">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="pl">損益（円・損失は −）</label>
        <input type="number" id="pl" inputmode="numeric" enterkeyhint="done">
      </div>
    </div>
    <button class="add-btn" id="addBtn">追加する</button>
  </header>

  <main>
    <div class="list-head">
      <span>売買履歴</span>
      <span class="right">
        <span class="count" id="count">0件</span>
        <button class="edit-btn" id="editBtn">編集</button>
      </span>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty">
      <div class="big">📈</div>
      まだ記録がありません。<br>上のフォームから追加してください。
    </div>
  </main>

  <footer>
    <span class="label">合計損益</span>
    <span class="total zero" id="total">0円</span>
  </footer>

<script>
  const STORAGE_KEY = 'kabu_pl_records_v1';
  const $ = (id) => document.getElementById(id);
  const dateEl = $('date'), nameEl = $('name'), plEl = $('pl');

  let records = load();
  let editing = false;

  // 起動時：日付欄を今日にする
  dateEl.value = todayStr();

  render();

  $('addBtn').addEventListener('click', add);
  $('editBtn').addEventListener('click', toggleEdit);
  // 損益欄でEnter/完了 → 追加
  plEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
  nameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') plEl.focus(); });

  function toggleEdit() {
    editing = !editing;
    render();
  }

  function add() {
    const date = dateEl.value;
    const name = nameEl.value.trim();
    const raw = plEl.value.trim();

    if (!date) { alert('売却日を入力してください'); return; }
    if (!name) { alert('銘柄を入力してください'); nameEl.focus(); return; }
    if (raw === '' || isNaN(Number(raw))) { alert('損益を数値で入力してください'); plEl.focus(); return; }

    records.push({
      id: newId(),
      date,
      name,
      pl: Math.round(Number(raw))
    });
    save();
    render();

    // 次の入力に備える（日付は今日にリセット、銘柄・損益は空に）
    nameEl.value = '';
    plEl.value = '';
    dateEl.value = todayStr();
    nameEl.focus();
  }

  function remove(id) {
    const r = records.find(x => x.id === id);
    if (r && !confirm(`「${r.name || 'この記録'}」を削除しますか？`)) return;
    records = records.filter(x => x.id !== id);
    save();
    render();
  }

  function render() {
    const list = $('list');
    list.innerHTML = '';

    // 新しい売却日が上（同日は後から入力したものが上）
    const sorted = [...records].sort((a, b) => {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return a.id < b.id ? 1 : -1;
    });

    $('empty').style.display = records.length ? 'none' : 'block';
    $('count').textContent = records.length + '件';

    // 記録が無いときは編集モードを解除・ボタンを隠す
    const editBtn = $('editBtn');
    if (!records.length) editing = false;
    editBtn.style.display = records.length ? '' : 'none';
    editBtn.textContent = editing ? '完了' : '編集';

    for (const r of sorted) {
      list.appendChild(editing ? editRow(r) : viewRow(r));
    }

    updateTotal();
  }

  // 小さなDOM生成ヘルパー（値は常にプロパティ経由でセット＝HTMLとして解釈されない）
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // 通常表示の行
  function viewRow(r) {
    const li = el('li');
    const main = el('div', 'li-main');
    main.append(el('div', 'li-name', r.name), el('div', 'li-date', formatDate(r.date)));
    const cls = r.pl > 0 ? 'plus' : (r.pl < 0 ? 'minus' : '');
    li.append(main, el('div', 'li-pl ' + cls, formatYen(r.pl)));
    return li;
  }

  // 編集モードの行（日付・銘柄・損益を直接編集＋削除）
  function editRow(r) {
    const li = el('li', 'editing');
    const grid = el('div', 'edit-grid');
    const dateI = el('input', 'e-date'); dateI.type = 'date'; dateI.value = r.date;
    const nameI = el('input', 'e-name'); nameI.type = 'text'; nameI.value = r.name;
    const plI = el('input', 'e-pl'); plI.type = 'number'; plI.inputMode = 'numeric'; plI.value = r.pl;
    grid.append(dateI, nameI, plI);
    const del = el('button', 'row-del', 'この記録を削除');
    li.append(grid, del);

    dateI.addEventListener('change', () => { if (dateI.value) { r.date = dateI.value; save(); } });
    nameI.addEventListener('input', () => { r.name = nameI.value; save(); });
    plI.addEventListener('input', () => {
      const v = plI.value.trim();
      r.pl = (v === '' || isNaN(Number(v))) ? 0 : Math.round(Number(v));
      save(); updateTotal();
    });
    del.addEventListener('click', () => remove(r.id));
    return li;
  }

  function updateTotal() {
    const total = records.reduce((s, r) => s + (Number(r.pl) || 0), 0);
    const totalEl = $('total');
    totalEl.textContent = formatYen(total);
    totalEl.className = 'total ' + (total > 0 ? 'plus' : (total < 0 ? 'minus' : 'zero'));
  }

  // ===== ユーティリティ =====
  function formatYen(n) {
    n = Math.round(Number(n)) || 0;
    const sign = n > 0 ? '+' : (n < 0 ? '-' : '');
    return sign + Math.abs(n).toLocaleString('ja-JP') + '円';
  }
  function formatDate(iso) {
    if (typeof iso !== 'string' || iso.indexOf('-') < 0) return iso || '';
    const [y, m, d] = iso.split('-');
    return `${y}/${m}/${d}`;
  }
  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function todayStr() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!Array.isArray(data)) return [];
      // 保存データを常に想定した型に正規化（壊れた/不正なデータで動作が崩れるのを防ぐ）
      return data
        .filter(r => r && typeof r === 'object')
        .map(r => ({
          id: (r.id != null && r.id !== '') ? String(r.id) : newId(),
          date: typeof r.date === 'string' ? r.date : '',
          name: typeof r.name === 'string' ? r.name : (r.name == null ? '' : String(r.name)),
          pl: Number.isFinite(Number(r.pl)) ? Math.round(Number(r.pl)) : 0
        }));
    } catch { return []; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }
</script>
</body>
</html>
